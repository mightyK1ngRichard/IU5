<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Arial, sans-serif" font-size="13">
  <style>
    .box   { fill:#fee2e2; stroke:#b91c1c; stroke-width:1.5; }
    .box-l { fill:#fef3c7; stroke:#b45309; stroke-width:1.5; }
    .mono  { font-family:Consolas,Menlo,monospace; font-size:12px; fill:#111; }
    .small { font-size:11px; fill:#444; }
    .arrow { stroke:#444; stroke-width:1.3; fill:none; }
    .title { font-size:16px; font-weight:bold; fill:#0f172a; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#444"/>
    </marker>
  </defs>

  <text x="20" y="28" class="title">Дерево плана без индексов (Seq Scan + Seq Scan)</text>

  <rect x="280" y="60" width="220" height="50" rx="6" class="box"/>
  <text x="390" y="82" text-anchor="middle" class="mono">π * (Projection)</text>
  <text x="390" y="100" text-anchor="middle" class="small">SELECT *</text>

  <rect x="220" y="150" width="340" height="60" rx="6" class="box"/>
  <text x="390" y="172" text-anchor="middle" class="mono">σ disciplines &amp;&amp; ARRAY(…)</text>
  <text x="390" y="190" text-anchor="middle" class="small">фильтр после Seq Scan</text>

  <rect x="240" y="250" width="300" height="60" rx="6" class="box-l"/>
  <text x="390" y="272" text-anchor="middle" class="mono">Seq Scan ⟶ students</text>
  <text x="390" y="290" text-anchor="middle" class="small">читаются ВСЕ страницы tab1</text>

  <rect x="40" y="350" width="260" height="50" rx="6" class="box"/>
  <text x="170" y="372" text-anchor="middle" class="mono">SubPlan / InitPlan</text>
  <text x="170" y="390" text-anchor="middle" class="small">array_agg(DISTINCT discipline)</text>

  <rect x="40" y="430" width="260" height="60" rx="6" class="box-l"/>
  <text x="170" y="452" text-anchor="middle" class="mono">Seq Scan ⟶ trainings</text>
  <text x="170" y="470" text-anchor="middle" class="small">фильтр: training_date BETWEEN</text>

  <line x1="390" y1="110" x2="390" y2="150" class="arrow" marker-end="url(#arr)"/>
  <line x1="390" y1="210" x2="390" y2="250" class="arrow" marker-end="url(#arr)"/>
  <line x1="170" y1="400" x2="170" y2="430" class="arrow" marker-end="url(#arr)"/>
  <path d="M170 350 C 170 290, 270 290, 290 280" class="arrow" marker-end="url(#arr)"/>

  <text x="170" y="510" class="small" text-anchor="middle">подзапрос (InitPlan)</text>
</svg>
